function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function lines(s){return esc(s).replace(/\n/g,'<br>');}
function rand(a){return a[Math.floor(Math.random()*a.length)];}
function words(s){return String(s||'').trim()?String(s).trim().split(/\s+/u).length:0;}
function lastDate(d){try{return new Date(d).toLocaleDateString('kk-KZ');}catch(e){return '—';}}
function val(s){return esc(s||'');}
function getPath(obj,path){return path.split('.').reduce((v,k)=>v&&v[k],obj);}
function setPath(obj,path,value){let parts=path.split('.'),t=obj;for(let i=0;i<parts.length-1;i++){if(!t[parts[i]])t[parts[i]]={};t=t[parts[i]];}t[parts.at(-1)]=value;}
function completion(p){if(!p)return 0;const checks=[p.idea,p.title,p.character.name,p.character.goal,p.character.obstacle,p.map.start,p.map.problem,p.map.climax,p.map.solution,p.words.polished,p.draft,p.final];return Math.round(checks.filter(v=>String(v||'').trim()).length/checks.length*100);}
function indicator(p){const percent=completion(p);return `<div class="statline"><span>Шығармашылық жұмыстың орындалуы</span><span class="mono">${percent}%</span></div><div class="progress"><div style="width:${percent}%"></div></div>`;}

function analyze(text,p){const s=String(text||'').trim();if(!s)return [{name:'Алғашқы қадам',msg:'Мәтінді өзіңіз жазып бастаңыз. Алдымен кейіпкерді және оқиға орнын таныстырыңыз.'}];const out=[];const wc=words(s);const paragraphs=s.split(/\n\s*\n|\n/u).map(x=>x.trim()).filter(Boolean);const sentences=s.split(/[.!?…]+/u).filter(x=>x.trim().length>2);const hasDialog=/[—–]\s*\p{L}/u.test(s);const langWords=(s.match(/сияқты|секілді|тәрізді|сыбырла|жарқыра|мөлдір|самал|алтын|ақырын|үнсіз|шуақ/giu)||[]).length;
if(wc<70)out.push({name:'Көлем және мазмұн',msg:'Әңгімеңіз әлі қысқа. Кейіпкердің мақсаты мен кедергісін қалай айқындай аласыз? Қай көріністі толықтыру керек?'});
if(paragraphs.length<3)out.push({name:'Абзац пен құрылым',msg:'Басталу, даму және шешім көріністерін бөлек абзацтармен көрсету мәтінді түсініктірек ете ме?'});
if(!hasDialog)out.push({name:'Кейіпкер дауысы',msg:'Кейіпкердің мінезін ашатын қысқа диалог қажет пе? Қай жерде ол оқиғаны дамытар еді?'});
if(!p.map.climax?.trim())out.push({name:'Шарықтау шегі',msg:'Оқиға картасындағы шешуші сәт әлі толтырылмаған. Ең маңызды таңдау қай сәтте жасалады?'});
if(!p.map.solution?.trim())out.push({name:'Оқиға шешімі',msg:'Кейіпкер әрекетінің нәтижесі қандай? Оқырман соңғы абзацтан нені түсінуі керек?'});
if(sentences.length>0&&sentences.some(x=>words(x)>33))out.push({name:'Сөйлем ырғағы',msg:'Кейбір сөйлемдер ұзақ болып көрінеді. Ойды екі сөйлемге бөлсеңіз, мағына анығырақ бола ма?'});
if(langWords<2)out.push({name:'Көркем тіл',msg:'Бір маңызды көріністі дыбыс, түс немесе сезім арқылы нақтылауға бола ма? Теңеу мен эпитетті орынды қолданыңыз.'});
if(!/[?!.…]/u.test(s))out.push({name:'Тыныс белгілері',msg:'Сөйлемдердің аяқталуын және тыныс белгілерін қайта тексеріңіз.'});
if(p.draft.trim()&&p.final.trim()&&p.draft.trim()===p.final.trim())out.push({name:'Өңдеу кезеңі',msg:'Алғашқы және соңғы нұсқа бірдей. Қай сөйлемді саналы өзгертуге болатынын қарастырыңыз.'});
if(out.length<3)out.push({name:'Авторлық үн',msg:'Мәтіндегі ең әсерлі шешім қайсы? Ол сіздің ойыңызды жеткізе ме?'});
return out;}

<div class="hstack between margin-bottom"><label class="hstack small" style="cursor:pointer"><input id="includeDemo" type="checkbox" ${teacherDemoVisible?'checked':''} style="accent-color:#16877d"> Демо деректерді көрсету</label><div class="action-row">${formAction('⬇️ CSV есеп','exportCSV','','soft')}${formAction('⬇️ JSON сақтық көшірмесі','backup','','light')}${formAction('⬆️ JSON жүктеу','import','','light')}</div></div>
<div class="cards margin-bottom"><div class="kpi"><div class="sym">📚</div><div class="big">${s.total}</div><div class="kpi-label">Жоба саны</div></div><div class="kpi"><div class="sym">✅</div><div class="big">${s.finished}</div><div class="kpi-label">Өңделген мәтіні бар</div></div><div class="kpi"><div class="sym">🎯</div><div class="big">${s.assessed.length}</div><div class="kpi-label">Екі кезеңде бағаланған</div></div></div>
<div class="two-col"><div class="card"><h3>📈 Нәтижелерді салыстыру</h3><p class="small margin-top">Әр көрсеткіш мұғалім белгілеген 0–4 балдан тұрады. Жалпы ұпай: 0–16.</p><div class="comparison margin-top"><div class="panel"><div class="small">Бастапқы бағалау</div><div class="score">${scoreNum(s.avgBefore)}<span class="small"> /16</span></div></div><div class="panel"><div class="small">Қорытынды бағалау</div><div class="score">${scoreNum(s.avgAfter)}<span class="small"> /16</span></div></div></div><div class="divider"></div>${s.assessed.length?RUBRIC.map(([key,label])=>{let a=s.assessed.reduce((t,x)=>t+x.rubric.before[key],0)/s.assessed.length,b=s.assessed.reduce((t,x)=>t+x.rubric.after[key],0)/s.assessed.length;return `<div class="small" style="font-weight:800;margin-top:13px">${esc(label)}</div><div class="score-line"><span class="small">Бұрын</span><div class="progress"><div style="width:${a/4*100}%;background:#a8b8cf"></div></div><b>${scoreNum(a)}</b></div><div class="score-line"><span class="small">Кейін</span><div class="progress"><div style="width:${b/4*100}%"></div></div><b>${scoreNum(b)}</b></div>`;}).join(''):'<div class="empty" style="padding:30px 15px"><div class="emoji">📈</div><p>Алғашқы және соңғы бағалар енгізілгенде нақты диаграммалар шығады.</p></div>'}</div>
<div class="card"><h3>🧑‍🎓 Жоба тізімі</h3><p class="small margin-top">Қарау үшін жұмысты таңдаңыз.</p><div class="margin-top" style="max-height:520px;overflow:auto">${s.list.length?s.list.slice().reverse().map(q=>`<div class="project-row ${p&&p.id===q.id?'selected':''}"><div><b>${esc(q.alias)} ${q.demo?'<span class="badge-demo">ДЕМО</span>':''}</b><small>${esc(q.title||'Атаусыз')} · ${esc(q.grade)}-сынып · ${completion(q)}%</small></div><button class="btn btn-sm btn-soft" data-action="teacherSelect" data-id="${q.id}">Бағалау</button></div>`).join(''):'<div class="empty" style="padding:25px"><p>Деректер жоқ. Алдымен жаңа шығармашылық жұмыс ашыңыз.</p></div>'}</div></div></div>
${p&&(!p.demo||teacherDemoVisible)?`<div class="card margin-top"><div class="hstack between"><div><h3>📝 Бағалау парағы: ${esc(p.alias)}</h3><p class="small">${esc(p.title||'Атаусыз')} · ${esc(p.grade)}-сынып ${p.demo?'<span class="badge-demo">ДЕМО ҮЛГІ</span>':''}</p></div><span class="pill-success">Бағалауды мұғалім енгізеді</span></div><div class="divider"></div><div class="rubric-grid"><div class="rubric-head">Критерий</div><div class="rubric-head">Бұрын</div><div class="rubric-head">Кейін</div>${RUBRIC.map(([key,label])=>`<div style="font-size:13px;font-weight:700">${esc(label)}</div>${['before','after'].map(period=>`<select aria-label="${esc(label)} ${period}" data-score="${period}.${key}"><option value="">—</option>${[0,1,2,3,4].map(n=>`<option value="${n}" ${p.rubric[period][key]===n?'selected':''}>${n}</option>`).join('')}</select>`).join('')}`).join('')}</div><div class="notice blue"><b>Шкала:</b> 0 — орындалмаған; 1 — бастапқы; 2 — жартылай; 3 — жақсы; 4 — дербес, жүйелі. Бірдей критерийді бастапқы және қорытынды жұмыстарға қолданыңыз.</div><div class="field"><label for="teacherNotes">Мұғалімнің кері байланысы</label><textarea id="teacherNotes" rows="3" data-field="notes" placeholder="Нақты жетістік, жақсартатын тұс, келесі қадам">${esc(p.notes)}</textarea></div><div class="action-row">${formAction('📖 Осы оқушының әңгімесін ашу','navigate','data-page="book"','soft')}${formAction('🗑️ Осы жұмысты өшіру','deleteProject','','danger')}</div></div>`:'<div class="card margin-top"><h3>📝 Бағалау</h3><p class="small" style="margin-top:8px">Тізімнен жұмысты таңдаңыз. Демо жұмысты бағалау үшін «Демо деректерді көрсету» опциясын қосыңыз.</p></div>'}
<div class="card margin-top"><h3>⚙️ Деректерді басқару</h3><p class="small margin-top">JSON файлы – деректердің сақтық көшірмесі; оны жеке қорғалған орында сақтаңыз. Бұл компьютерді басқа оқушылар да қолданса, жұмысты аяқтағаннан кейін сақтық көшірме жасаңыз.</p><div class="action-row margin-top">${formAction('Барлық жергілікті деректі өшіру','clearAll','','danger')}</div></div>`;}
function render(){let p=project();let content={home:renderHome,idea:renderIdea,character:renderCharacter,map:renderMap,words:renderWords,editor:renderEditor,book:renderBook,teacher:renderTeacher}[page]();document.getElementById('app').innerHTML=header()+`<div class="shell"><aside class="sidebar"><nav class="sidebar-card" aria-label="Негізгі бөлімдер"><div class="sidebar-label">Зертхана бөлімдері</div>${NAV.slice(0,7).map(([id,e,n],i)=>`<button class="nav-btn ${page===id?'active':''}" data-action="navigate" data-page="${id}" ${page===id?'aria-current="page"':''}><span class="nav-icon">${e}</span><span>${n}</span><span class="nav-number">${i===0?'●':'0'+i}</span></button>`).join('')}<div class="sidebar-divider"></div><div class="sidebar-label">Мұғалімге</div><button class="nav-btn ${page==='teacher'?'active':''}" data-action="navigate" data-page="teacher"><span class="nav-icon">📊</span><span>Мониторинг</span></button><div class="sidebar-foot"><strong>✦ Оқушы — автор</strong><p>Ақылды көмекші сұрақ қояды. Әңгімені оқушының өзі жазады.</p></div></nav></aside><main class="work">${content}<div class="footer-note">AI STORY LAB · Авторлық педагогикалық өнім · Интернетсіз жұмыс · Жергілікті сақтау · © 2026</div></main></div>`;document.title='AI STORY LAB · '+NAV.find(x=>x[0]===page)[2];}
function go(dest){if(!NAV.find(x=>x[0]===dest))return;page=dest;feedback=null;render();window.scrollTo({top:0,behavior:'instant'});}
function create(){const alias=document.getElementById('newAlias')?.value.trim();const grade=document.getElementById('newGrade')?.value||'7';if(!alias){alert('Автор кодын немесе бүркеншік атын енгізіңіз.');document.getElementById('newAlias')?.focus();return;}if(appState.projects.length>200){alert('Браузерде 200-ден көп жұмыс бар. Алдымен JSON сақтық көшірмесін жасаңыз.');return;}const p=makeProject(alias,grade);appState.projects.push(p);appState.activeId=p.id;generatedIdea=null;save();go('idea');}
function createDemo(){let p=appState.projects.find(x=>x.demo);if(!p){p=demoProject();appState.projects.push(p);}appState.activeId=p.id;save();go('book');}
function generateIdea(){const p=project();if(!p)return;const name=rand(themeData[p.theme]||themeData['Адалдық']);const setting=rand(settings);const twist=rand(twists);generatedIdea={title:name,setting,twist,questions:[`Басты кейіпкер ${setting} қандай жағдайға тап болады?`,`Осы оқиғада «${p.theme.toLowerCase()}» тақырыбы қалай көрінеді?`,'Кейіпкер маңызды сәтте қандай таңдау жасайды?']};render();}
function copyPrompt(kind){const p=project();if(!p)return;let prompt=kind==='map'?`Мен ${p.grade}-сынып оқушысымын. Менің әңгімемнің атауы: «${p.title||'Атаусыз'}». Тақырыбы: ${p.theme}. Сюжетім: ${p.map.start} / ${p.map.problem} / ${p.map.climax} / ${p.map.solution}. Маған дайын әңгіме жазба, мәтінімді өзің өзгертіп берме. Сюжеттегі логикалық байланыстарды дамытуға көмектесетін ТЕК 4 қысқа сұрақ қой.`: `Мен ${p.grade}-сынып оқушысымын. Әңгіме тақырыбы: ${p.theme}. Жанры: ${p.genre}. Менің идеям: ${p.idea||'Әзірше идея жоқ'}. Дайын әңгіме немесе ұзақ мәтін жазба. Өз әңгімемді өзім құрастыруым үшін ТЕК 3 бағыттаушы сұрақ қой. Жеке деректерді сұрама.`;if(navigator.clipboard&&location.protocol!=='file:'){navigator.clipboard.writeText(prompt).then(()=>alert('Бағыттаушы промпт көшірілді. Оны мұғалім рұқсат еткен ЖИ жүйесінде қолдануға болады.')).catch(()=>fallbackCopy(prompt));}else fallbackCopy(prompt);}
function fallbackCopy(s){let ta=document.createElement('textarea');ta.value=s;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();if(ok)alert('Промпт көшірілді. Оны мұғалім рұқсат еткен ЖИ жүйесінде қолдануға болады.');else prompt('Промптты қолмен көшіріңіз:',s);}
function review(){const p=project();feedback=analyze(p.final.trim()?p.final:p.draft,p);render();}
function addWord(){let p=project();if(!p?.words.polished.trim()){alert('Алдымен өзіңіздің көркем сөйлеміңізді жазыңыз.');return;}p.final=(p.final.trim()?p.final.trim()+'\n\n':'')+p.words.polished.trim();p.updated=new Date().toISOString();save();alert('Сөйлем өңделген әңгімеге қосылды.');go('editor');}
function downloadBlob(str,name,type){let blob=new Blob([str],{type});let url=URL.createObjectURL(blob);let a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),5000);}
function safeFilename(s){return String(s||'story').normalize('NFKD').replace(/[^\p{L}\p{N}_-]+/gu,'_').slice(0,45)||'story';}
function printBook(){const p=project();if(!p)return;const s=(p.final||p.draft||'').trim();if(!s){alert('Алдымен әңгімеңіздің мәтінін жазыңыз.');return;}document.getElementById('printBook').innerHTML=`<div class="print-cover"><div class="print-mark">✦ AI STORY LAB</div><h1>${esc(p.title||'Менің алғашқы әңгімем')}</h1><div class="print-byline">${esc(p.genre)}<br>Авторы: ${esc(p.alias)} · ${esc(p.grade)}-сынып</div></div><article><h2 class="print-story-title">${esc(p.title||'Менің алғашқы әңгімем')}</h2><div class="print-story">${esc(s)}</div><div class="print-end">✦ Соңы ✦<br>AI STORY LAB · Оқушы — автор</div></article>`;window.print();}
function getCSV(){let header=['Автор коды','Сынып','Тақырып','Әңгіме атауы','Алғашқы сөз саны','Соңғы сөз саны','Аяқталуы (%)',...RUBRIC.map(r=>'Бұрын: '+r[1]),...RUBRIC.map(r=>'Кейін: '+r[1]),'Бастапқы жиыны','Қорытынды жиыны'];let rows=stats().list.map(p=>[p.alias,p.grade,p.theme,p.title,words(p.draft),words(p.final),completion(p),...RUBRIC.map(([k])=>p.rubric.before[k]??''),...RUBRIC.map(([k])=>p.rubric.after[k]??''),scoreSum(p.rubric.before)??'',scoreSum(p.rubric.after)??'']);return '\ufeff'+[header,...rows].map(row=>row.map(x=>{let v=String(x??'');if(/^[=+@-]/.test(v))v="'"+v;return '"'+v.replaceAll('"','""')+'"';}).join(';')).join('\r\n');}
function sanitizeImport(data){if(!data||!Array.isArray(data.projects)||data.projects.length>250)throw Error('Дерек құрылымы қате немесе файл тым үлкен.');let cleaned=data.projects.filter(p=>p&&typeof p==='object'&&typeof p.id==='string'&&/^p[a-z0-9]+$/i.test(p.id)&&p.id.length<80&&typeof p.alias==='string'&&p.alias.length<60&&typeof p.title==='string'&&p.title.length<150&&typeof p.draft==='string'&&p.draft.length<300000&&typeof p.final==='string'&&p.final.length<300000&&p.map&&p.character&&p.words&&p.rubric&&p.rubric.before&&p.rubric.after).map(p=>{let base=makeProject(p.alias,p.grade,!!p.demo);base.id=p.id;base.created=p.created||base.created;base.updated=p.updated||base.updated;for(let k of ['title','theme','genre','idea','draft','final','notes'])base[k]=typeof p[k]==='string'?p[k]:base[k];for(let key of ['character','map','words'])for(let k in base[key])base[key][k]=typeof p[key][k]==='string'?p[key][k]:'';base.cover=['sapphire','mint','rose','amber'].includes(p.cover)?p.cover:'sapphire';for(let period of ['before','after'])for(let [k] of RUBRIC){let n=p.rubric[period][k];base.rubric[period][k]=Number.isInteger(n)&&n>=0&&n<=4?n:null;}return base;});return {projects:cleaned,activeId:cleaned.some(p=>p.id===data.activeId)?data.activeId:(cleaned[0]?.id||null)};}
function handleClick(e){const btn=e.target.closest('button[data-action]');if(!btn)return;const action=btn.dataset.action,p=project();if(action==='navigate'){go(btn.dataset.page);return;}if(action==='create')return create();if(action==='demo')return createDemo();if(action==='selectProject'||action==='teacherSelect'){appState.activeId=btn.dataset.id;save();if(action==='selectProject')go('idea');else render();return;}if(!p&& !['backup','import','clearAll','exportCSV'].includes(action))return;
switch(action){case'generateIdea':generateIdea();break;case'useIdea':if(generatedIdea){p.title=generatedIdea.title;p.idea=`${generatedIdea.setting} өтетін оқиға. ${generatedIdea.twist} Осы жағдай арқылы «${p.theme.toLowerCase()}» тақырыбын ашқым келеді.`;p.questions=generatedIdea.questions;p.updated=new Date().toISOString();save();render();}break;case'copyPrompt':copyPrompt(btn.dataset.kind);break;case'characterQuestion':{const q=rand(['Кейіпкер қателескен кезде не істейді?','Кейіпкердің ең маңызды қасиеті қандай әрекеттен көрінеді?','Ол кімнің пікірінен қорқады?','Оқиға басында және соңында қандай өзгеріс болады?','Кейіпкер мақсатына жету үшін неден бас тартуы мүмкін?']);document.getElementById('characterHint').textContent='💬 '+q;break;}case'chooseDevice':wordDevice=btn.dataset.device;render();break;case'wordChallenge':wordPrompt=rand(['«Жаңбыр жауды» сөйлемін кейіптеу арқылы өзгертіп көр.','«Бала қуанды» сөйлемін сезім арқылы сипатта.','Кейіпкердің қорыққанын «қорықты» демей жеткіз.','Достардың арасындағы қысқа, мағыналы диалог жаз.','«Ауыл тыныш еді» сөйлеміне эпитет қос.','«Кітап қызықты болды» деген ойды көркем жеткіз.']);document.getElementById('wordChallengeText').textContent=wordPrompt;break;case'addWordToFinal':addWord();break;case'review':review();break;case'copyDraft':p.final=p.draft;p.updated=new Date().toISOString();save();render();break;case'cover':p.cover=btn.dataset.color;p.updated=new Date().toISOString();save();render();break;case'print':printBook();break;case'downloadText':downloadBlob(`${p.title||'Менің алғашқы әңгімем'}\nАвторы: ${p.alias}\n\n${p.final||p.draft}`,safeFilename(p.title)+'.txt','text/plain;charset=utf-8');break;case'exportCSV':downloadBlob(getCSV(),'AI_STORY_LAB_мониторинг.csv','text/csv;charset=utf-8');break;case'backup':downloadBlob(JSON.stringify(appState,null,2),'AI_STORY_LAB_backup.json','application/json;charset=utf-8');break;case'import':document.getElementById('fileImporter').click();break;case'deleteProject':if(confirm(`«${p.alias}» жұмысы өшіріледі. Бұл әрекетті кері қайтару мүмкін емес. Жалғастырасыз ба?`)){appState.projects=appState.projects.filter(x=>x.id!==p.id);appState.activeId=appState.projects[0]?.id||null;save();go('teacher');}break;case'clearAll':if(confirm('Барлық жергілікті жұмыстар өшіріледі. Алдымен сақтық көшірмесін жасадыңыз ба?')){if(confirm('Шынымен БАРЛЫҚ жұмысты өшіресіз бе?')){appState=fresh();localStorage.removeItem(STORAGE_KEY);go('home');}}break;}
}
document.addEventListener('click',handleClick);
document.addEventListener('input',e=>{let t=e.target,p=project();if(!t.dataset.field||!p)return;setPath(p,t.dataset.field,t.value);p.updated=new Date().toISOString();clearTimeout(saveTimer);saveTimer=setTimeout(save,220);const d=document.getElementById('draftWordCount'),f=document.getElementById('finalWordCount');if(d)d.textContent=words(p.draft)+' сөз';if(f)f.textContent=words(p.final)+' сөз';});
document.addEventListener('change',e=>{let t=e.target,p=project();if(t.id==='includeDemo'){teacherDemoVisible=t.checked;render();return;}if(!p)return;if(t.dataset.score){let [period,key]=t.dataset.score.split('.');p.rubric[period][key]=t.value===''?null:Number(t.value);p.updated=new Date().toISOString();save();render();return;}if(t.dataset.field&&t.dataset.render){generatedIdea=null;save();render();}});
document.getElementById('fileImporter').addEventListener('change',async e=>{let file=e.target.files?.[0];if(!file)return;try{if(file.size>4000000)throw Error('Файл тым үлкен');let data=JSON.parse(await file.text());let clean=sanitizeImport(data);if(!confirm(`Сақтық көшірмесінде ${clean.projects.length} жұмыс бар. Қазіргі жұмыстарды осы файлмен АУЫСТЫРАМЫЗ ба?`))return;appState=clean;save();go('home');alert('Сақтық көшірмесі жүктелді.');}catch(err){alert('JSON файлын оқу мүмкін болмады: '+err.message);}finally{e.target.value='';}});
render();
</script>
</body>
</html>
